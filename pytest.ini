[pytest]
testpaths = tests
# auto mode runs async tests and fixtures without a per-test decorator
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# --strict-markers fails the run when test code uses an unregistered marker (a typo such as
# pytest.mark.intergration). It does not check the -m expression: `-m unti` just selects nothing.
addopts = --strict-markers
# Every test module declares unit or integration; test_performance.py marks each test with both
# performance and one of the two, so `-m unit` still never needs a database.
# Select with -m:  pytest -m unit   |   pytest -m integration
markers =
    unit: pure logic, needs no database - runs in under a second without Docker
    integration: goes through the HTTP API into a real PostgreSQL
    performance: large Data Sets on the largest accepted text, with time budgets
